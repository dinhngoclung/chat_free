name: Build APK - EXE - IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.3'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.3'
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ChatFree-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ChatFree-Windows.zip
          retention-days: 7

  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.3'
          cache: true
      - run: flutter config --enable-ios
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ChatFree.ipa Payload
          mv ChatFree.ipa ../../../ChatFree-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ChatFree-unsigned.ipa
          retention-days: 7
